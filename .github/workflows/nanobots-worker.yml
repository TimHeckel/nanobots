# nanobots:engine-owned v0.1 — re-rendered by `nanobots update`
#
# Zero-ops floor for the worker role. Polls on its own cadence and, when it finds a
# claimable approved Ready item, delegates the actual build to a disposable Daytona
# sandbox — this job itself never runs product code. Enable by setting the repo variable
# NANOBOTS_WORKER_ENABLED=1 and the secrets below. Disable by unsetting the variable.

on:
  schedule:
    - cron: '*/15 * * * *' # every 15 min; a run with nothing claimable costs almost nothing
  workflow_dispatch:

concurrency:
  group: nanobots-worker
  cancel-in-progress: false

jobs:
  worker:
    if: vars.NANOBOTS_WORKER_ENABLED == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ secrets.PROJECTS_PAT }}
      DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Bind the worker to any engine. Leave unset for the shipped default (claude -p).
      # NANOBOTS_WORKER_ENV lists extra secret names to forward into the sandbox.
      NANOBOTS_WORKER_CMD: ${{ vars.NANOBOTS_WORKER_CMD }}
      NANOBOTS_WORKER_ENV: ${{ vars.NANOBOTS_WORKER_ENV }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # Optional but recommended: with all three set, the sandbox receives a per-run,
      # repo-scoped installation token (no pull_requests permission) instead of the PAT.
      # This job is the CONTROLLER — the private key stays here and never enters the sandbox.
      NANOBOTS_GITHUB_APP_ID: ${{ secrets.NANOBOTS_GITHUB_APP_ID }}
      NANOBOTS_GITHUB_APP_INSTALLATION_ID: ${{ secrets.NANOBOTS_GITHUB_APP_INSTALLATION_ID }}
      NANOBOTS_GITHUB_APP_PRIVATE_KEY: ${{ secrets.NANOBOTS_GITHUB_APP_PRIVATE_KEY }}
      # Opt-in only, and only after an org owner grants Workflows: write on the installation —
      # requesting an ungranted permission makes EVERY token mint fail.
      NANOBOTS_GITHUB_APP_WORKFLOWS: ${{ vars.NANOBOTS_GITHUB_APP_WORKFLOWS }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run one worker cycle
        run: bash .nanobots/run-cycle.sh worker
