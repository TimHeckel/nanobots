<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>nanobots — dashboard</title>
<link rel="stylesheet" href="shared.css">
<style>
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--dim); font-weight: 600; }
  .state-open { color: var(--accent); }
  .state-closed { color: var(--dim); }
  .labels { color: var(--dim); font-size: 11.5px; }
  #empty { color: var(--dim); padding: 30px 0; }

  h2 { font-size: 13px; color: var(--dim); font-weight: 600; text-transform: lowercase;
    margin: 26px 0 10px; }
  .card { border: 1px solid var(--border); border-left: 3px solid var(--dim);
    border-radius: 0 8px 8px 0; padding: 12px 14px; margin-bottom: 10px; background: var(--panel); }
  .card.blocked { border-left-color: #f87171; }
  .card .why { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: #f87171; }
  .card .t { margin: 3px 0 8px; }
  .card .acts a, .card .acts button { font-size: 12px; margin-right: 12px; }
  .pill { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 10px;
    border: 1px solid var(--border); color: var(--dim); }
  .beat { font-size: 12.5px; color: var(--dim); margin-bottom: 4px; }
  .beat b { color: var(--text); }
  .beat.stale b { color: #fbbf24; }
  .allclear { color: var(--accent); font-size: 13px; padding: 6px 0 2px; }
  .row-focus { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  button.mini { background: var(--panel); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 3px 10px; font: inherit; font-size: 12px; cursor: pointer; }
  button.mini:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>
<main>
  <nav>
    <h1>nano<span class="bot">bots</span></h1>
    <span class="spacer"></span>
    <a href="history.html" class="here">dashboard</a>
    <a href="chat.html">chat</a>
    <a href="options.html">options</a>
  </nav>

  <section id="live">
    <div id="beats"></div>
    <h2>needs you</h2>
    <div id="needs"></div>
    <h2>in flight</h2>
    <div id="moving" class="dim"></div>
  </section>

  <h2>filed from this browser</h2>
  <p class="dim" id="count"></p>
  <div id="empty" hidden>Nothing filed yet — click the nanobots icon on any page to make your first report.</div>
  <table id="table" hidden>
    <thead><tr><th>issue</th><th>type</th><th>state</th><th>page</th><th>filed</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</main>
<script type="module" src="history.js"></script>
</body>
</html>
