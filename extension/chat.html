<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>nanobots — chat</title>
<link rel="stylesheet" href="shared.css">
<style>
  /* shared.css caps main at 900px, which suits the options wizard but wastes the window
     here — chat answers are long and often contain code and tables. */
  main { max-width: none; margin: 0; padding: 20px 28px 40px; }
  #log { max-height: none; }
  /* Markdown produced by md() below. */
  .msg h3, .msg h4 { font-size: 14px; margin: 10px 0 4px; color: var(--text); }
  .msg ul, .msg ol { margin: 4px 0 4px 20px; }
  .msg li { margin: 2px 0; }
  .msg p { margin: 6px 0; }
  .msg code { background: var(--panel); border: 1px solid var(--border); border-radius: 4px;
    padding: 1px 5px; font-size: 12.5px; }
  .msg pre { background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
    padding: 10px 12px; overflow-x: auto; margin: 8px 0; }
  .msg pre code { background: none; border: 0; padding: 0; }
  .msg strong { color: #e6edf3; }
  /* The in-flight indicator: three dots that fade in sequence. */
  .thinking .dots span { animation: nb-blink 1.2s infinite; }
  .thinking .dots span:nth-child(2) { animation-delay: .2s; }
  .thinking .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes nb-blink { 0%, 80%, 100% { opacity: .25 } 40% { opacity: 1 } }
</style>
<style>
  #topbar { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
  #topbar select { width: auto; }
  #log { border: 1px solid var(--border); border-radius: 8px; background: var(--panel);
    min-height: 45vh; max-height: 60vh; overflow-y: auto; padding: 16px; margin-bottom: 12px; }
  .msg { margin-bottom: 14px; white-space: pre-wrap; word-break: break-word; }
  .msg .who { font-size: 11px; color: var(--dim); display: block; }
  .msg.user .who { color: var(--cyan); }
  .msg.agent .who { color: var(--accent); }
  .msg.tool { color: var(--dim); font-size: 12px; }
  .msg img { max-width: 220px; border: 1px solid var(--border); border-radius: 6px; display: block; margin-top: 6px; }
  #attachments { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  #attachments .thumb { position: relative; }
  #attachments img { height: 60px; border: 1px solid var(--border); border-radius: 6px; }
  #attachments button { position: absolute; top: -6px; right: -6px; background: var(--red); color: #fff;
    border: none; border-radius: 50%; width: 18px; height: 18px; font-size: 11px; cursor: pointer; line-height: 1; }
  #composer { display: flex; gap: 8px; }
  #composer textarea { flex: 1; min-height: 54px; resize: vertical; }
  #composer .primary { align-self: stretch; }
  .hint { color: var(--dim); font-size: 12px; margin-top: 6px; }
</style>
</head>
<body>
<main>
  <nav>
    <h1>nano<span class="bot">bots</span></h1>
    <span class="spacer"></span>
    <a href="history.html">history</a>
    <a href="chat.html" class="here">chat</a>
    <a href="options.html">options</a>
  </nav>

  <div id="topbar">
    <label for="repo" style="margin:0">repo</label>
    <select id="repo"></select>
    <span class="dim" id="promptsrc"></span>
  </div>

  <div id="log"></div>
  <div id="attachments"></div>
  <div id="composer">
    <textarea id="input" placeholder="Ask about the repo, or describe something to file — paste/drop screenshots right here."></textarea>
    <button id="send" class="primary">send</button>
  </div>
  <div class="hint">The agent searches the actual repo (code, files, issues) and can file reports with your attached screenshots. Its instructions live in <code>.nanobots/EXTENSION-PROMPT.md</code> — refined over time by the repo's outer loop.</div>
</main>
<script type="module" src="chat.js"></script>
</body>
</html>
