# nanobots:engine-owned v0.1 — re-rendered by `nanobots update`
#
# Zero-ops floor for the worker role. Polls on its own cadence and, when it finds a
# claimable approved Ready item, delegates the actual build to a disposable Daytona
# sandbox — this job itself never runs product code. Enable by setting the repo variable
# NANOBOTS_WORKER_ENABLED=1 and the secrets below. Disable by unsetting the variable.

on:
  schedule:
    - cron: '*/15 * * * *' # every 15 min; a run with nothing claimable costs almost nothing
  workflow_dispatch:

concurrency:
  group: nanobots-worker
  cancel-in-progress: false

jobs:
  worker:
    if: vars.NANOBOTS_WORKER_ENABLED == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ secrets.PROJECTS_PAT }}
      DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run one worker cycle
        run: bash .nanobots/run-cycle.sh worker
